# ThreatIngestor sidecar config — https://github.com/InQuest/ThreatIngestor
# Curated RSS feeds; artifacts land in /data/threatingestor_artifacts.db.
# AMD-Agent polls and validates via ThreatIntelCollector (Plan B).

general:
  # daemon/sleep overridden by docker/threatingestor-entrypoint.sh:
  # bootstrap: AMD_THREATINGESTOR_SLEEP_BOOTSTRAP (default 60s)
  # steady (after 100/100 trainable samples): AMD_THREATINGESTOR_SLEEP_STEADY (default 900s)
  daemon: true
  sleep: 900
  state_path: /data/threatingestor_state.db

credentials: []

sources:
  - name: rss-unit42
    module: rss
    url: https://unit42.paloaltonetworks.com/feed/
    feed_type: messy

  - name: rss-securelist
    module: rss
    url: https://securelist.com/feed/
    feed_type: messy

  - name: rss-citizenlab
    module: rss
    url: https://citizenlab.ca/feed/
    feed_type: messy

  - name: rss-malwarebytes
    module: rss
    url: https://www.malwarebytes.com/blog/feed
    feed_type: messy

operators:
  - name: amd-agent-sha256-artifacts
    module: sqlite
    filename: /data/threatingestor_artifacts.db
    artifact_types: [Hash]
    filter: "^[a-fA-F0-9]{64}$"
