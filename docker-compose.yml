services:
  amd-agent:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      AMD_AGENT_CONTAINER: "1"
      AMD_OLLAMA_BASE_URL: "${AMD_OLLAMA_BASE_URL:-http://ollama-host:11434}"
      AMD_CAPA_RULES_DIR: "/opt/capa-rules"
    volumes:
      - ./data:/data
      - ./data/benign:/data/benign:ro
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "ollama-host:host-gateway"
      - "host.docker.internal:host-gateway"
    networks:
      - malware_net

networks:
  malware_net:
    driver: bridge
